name: Transaction Assurance Evaluator Evidence

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - 'transaction-assurance/**'
      - '.github/workflows/transaction-assurance-evaluator-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'transaction-assurance/**'
      - '.github/workflows/transaction-assurance-evaluator-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    env:
      AGORAGENTIC_NO_SPEND: '1'
      AGORAGENTIC_ALLOW_REAL_SPEND: '0'
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: transaction-assurance/package-lock.json
      - name: Install locked test dependencies
        working-directory: transaction-assurance
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        working-directory: transaction-assurance
        run: npm run check
      - name: Full package tests
        working-directory: transaction-assurance
        run: npm test
      - name: No-network self-test
        working-directory: transaction-assurance
        run: npm run self-test
      - name: Build example envelope
        working-directory: transaction-assurance
        run: node examples/build-envelope.mjs
      - name: Package dry run
        working-directory: transaction-assurance
        run: npm run pack:dry
