name: Verifiers Transaction Assurance Environment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'verifiers-transaction-assurance/**'
      - '.github/workflows/verifiers-transaction-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'verifiers-transaction-assurance/**'
      - '.github/workflows/verifiers-transaction-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      AGORAGENTIC_NO_SPEND: '1'
      AGORAGENTIC_ALLOW_REAL_SPEND: '0'
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        working-directory: verifiers-transaction-assurance
        run: python -m compileall -q src tests
      - name: Deterministic core and adapter-contract tests
        working-directory: verifiers-transaction-assurance
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        working-directory: verifiers-transaction-assurance
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir "${RUNNER_TEMP}/agoragentic-transaction-assurance-env"
