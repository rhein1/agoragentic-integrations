name: Verifiers Transaction Assurance Environment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'verifiers-transaction-assurance/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - 'scripts/integration-inventory-holds.js'
      - 'scripts/verify-integrations-json.js'
      - 'test/integration-inventory-holds.test.mjs'
      - '.github/workflows/verifiers-transaction-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'verifiers-transaction-assurance/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - 'scripts/integration-inventory-holds.js'
      - 'scripts/verify-integrations-json.js'
      - 'test/integration-inventory-holds.test.mjs'
      - '.github/workflows/verifiers-transaction-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      AGORAGENTIC_NO_SPEND: '1'
      AGORAGENTIC_ALLOW_REAL_SPEND: '0'
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Static checks
        working-directory: verifiers-transaction-assurance
        run: |
          python -m pip install ruff==0.16.2
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Compile sources
        working-directory: verifiers-transaction-assurance
        run: python -m compileall -q src tests
      - name: Build wheel and source distribution
        working-directory: verifiers-transaction-assurance
        run: |
          python -m pip install build==1.5.0
          python -m build --sdist --wheel --outdir "${RUNNER_TEMP}/agoragentic-transaction-assurance-env"
      - name: Install built wheel with exact Prime Verifiers release
        run: |
          wheel="$(find "${RUNNER_TEMP}/agoragentic-transaction-assurance-env" -name '*.whl' -print -quit)"
          test -n "${wheel}"
          python -m pip install "${wheel}[prime]"
          python -m pip check
      - name: Verify exact upstream and installed package
        run: |
          python -c "from importlib.metadata import version; assert version('verifiers') == '0.3.0'; assert version('agoragentic-transaction-assurance-env') == '0.2.0a0'"
          python -c "import agoragentic_transaction_assurance_env as a; import verifiers.v1 as vf; assert a.PRIME_VERIFIERS_AVAILABLE; assert vf.Taskset.__module__ == 'verifiers.v1.taskset'"
      - name: Deterministic core and real adapter tests
        working-directory: verifiers-transaction-assurance
        run: python -m unittest discover -s tests -v
      - name: Deterministic Tumbler benchmark smoke
        run: |
          agoragentic-tumbler-benchmark --policy safety_first_v1 --out "${RUNNER_TEMP}/tumbler-baseline.json"
          python -c "import json, os; p=json.load(open(os.environ['RUNNER_TEMP'] + '/tumbler-baseline.json')); assert p['summary']['pass_count'] == p['summary']['scenario_count'] == 8"
      - name: Central inventory hold tests
        run: node --test test/integration-inventory-holds.test.mjs
      - name: Root machine-surface verifier
        run: node scripts/verify-integrations-json.js
