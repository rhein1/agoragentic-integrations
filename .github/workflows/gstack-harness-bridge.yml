name: gstack Harness Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'gstack/**'
      - 'harness-core/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - '.github/workflows/gstack-harness-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'gstack/**'
      - 'harness-core/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - '.github/workflows/gstack-harness-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    env:
      AGORAGENTIC_NO_SPEND: '1'
      AGORAGENTIC_ALLOW_REAL_SPEND: '0'
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: '0'
    defaults:
      run:
        working-directory: gstack
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:core-compat
