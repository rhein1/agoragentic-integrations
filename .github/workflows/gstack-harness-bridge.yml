name: gstack Harness Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'gstack/**'
      - 'harness-core/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - '.github/workflows/gstack-harness-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'gstack/**'
      - 'harness-core/**'
      - 'integrations.json'
      - 'integrations.schema.json'
      - '.github/workflows/gstack-harness-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    env:
      AGORAGENTIC_NO_SPEND: '1'
      AGORAGENTIC_ALLOW_REAL_SPEND: '0'
      AGORAGENTIC_ALLOW_NETWORK_CANARIES: '0'
    defaults:
      run:
        working-directory: gstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:core-compat
