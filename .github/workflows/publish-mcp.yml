name: Verify MCP publication remains disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert the unqualified source candidate is non-publishable
        run: |
          node - <<'NODE'
          const packageJson = require('./mcp/package.json');
          if (packageJson.private !== true) {
            throw new Error('MCP source candidate must remain private');
          }
          if (!String(packageJson.scripts?.prepublishOnly || '').includes('MCP_PUBLISH_DISABLED')) {
            throw new Error('MCP prepublish guard is missing');
          }
          NODE
