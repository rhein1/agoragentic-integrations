name: Publish Harness Core

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  AGORAGENTIC_NO_SPEND: 1
  AGORAGENTIC_ALLOW_REAL_SPEND: 0
  AGORAGENTIC_ALLOW_NETWORK_CANARIES: 0

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify exact release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node examples/frameworks/validate.mjs
      - run: npm run pack:smoke
      - run: npm pack --dry-run --json
      - run: npm publish --access public --provenance
